    <style>
        /* --- スマホ対応・広告はみ出し防止スタイル --- */
        .ad-wrapper {
            width: 100%;           /* 幅を画面いっぱいに */
            max-width: 100vw;      /* 画面幅を超えないように制限 */

        }

        .ad-label {
            font-size: 10px;
            color: #999;
            margin-bottom: 8px;
            display: block;
        }

        /* ヒーローセクションのスマホ調整 */

            font-size: 1.5rem; /* スマホで文字が大きすぎるのを防ぐ */
            padding: 0 15px;
        }

        /* ボタンがスマホで重ならないように調整 */
        .cta-buttons .btn {
            margin-bottom: 10px;
            width: 90%; /* スマホではボタンを横いっぱいに近くする */
            max-width: 300px;
        }

        @media (min-width: 768px) {
            .cta-buttons .btn {
                width: auto; /* PCでは元のサイズに戻す */
            }
        }
    </style>
